name: kitty-ms

services:
  # ---------------------------------------------------------------
  # MySQL 8.4.11：同一实例，通过 mysql-init.sql 建 3 个独立业务库
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "true"
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [kitty-net]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -uroot
          -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------
  # product-service：端口 8081，DB=kitty_product，拥有 product 表
  # ---------------------------------------------------------------
  product-service:
    image: kitty-ms-product:week06
    build:
      context: ./services/product-service
    ports: ["${PRODUCT_PORT:-8081}:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kitty_product?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [kitty-net]

  # ---------------------------------------------------------------
  # user-service：端口 8082，DB=kitty_user，拥有 user 表
  # ---------------------------------------------------------------
  user-service:
    image: kitty-ms-user:week06
    build:
      context: ./services/user-service
    ports: ["${USER_PORT:-8082}:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kitty_user?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [kitty-net]

  # ---------------------------------------------------------------
  # order-service：端口 8083，DB=kitty_order，通过 HTTP 调用
  # product-service / user-service 完成校验与扣库存，本地再写入 shop_order
  # ---------------------------------------------------------------
  order-service:
    image: kitty-ms-order:week06
    build:
      context: ./services/order-service
    ports: ["${ORDER_PORT:-8083}:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kitty_order?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8080
      USER_SERVICE_URL:     http://user-service:8080
      CONNECT_TIMEOUT_MS: 2000
      READ_TIMEOUT_MS:    5000
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      product-service:
        condition: service_started
      user-service:
        condition: service_started
    networks: [kitty-net]

volumes:
  mysql-data:

networks:
  kitty-net:
