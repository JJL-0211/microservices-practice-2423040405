server:
  port: 8080
  # 开放health端点
  management:
    endpoints:
      web:
        exposure:
          include: health

spring:
  # 本地 MySQL 连接配置（先在 MySQL 中执行 CREATE DATABASE kitty_shop;）
  datasource:
    url: "jdbc:mysql://localhost:3306/kitty_shop?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true"
    username: root
    password: 666888
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 首次启动自动建表/更新表结构
      ddl-auto: update
    open-in-view: false
    # 表结构生成后再执行 data.sql，保证初始化数据可落库
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      # 每次启动执行 data.sql 准备可重复的演示数据
      mode: always
      continue-on-error: true