server:
  port: 8080
spring:
  application:
    name: order-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kitty_order?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:root}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

# 跨服务调用：服务地址 + 超时（毫秒），Compose 环境变量覆盖
app:
  product-url: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
  user-url:     "${USER_SERVICE_URL:http://localhost:8082}"
  connect-timeout-ms: "${CONNECT_TIMEOUT_MS:2000}"
  read-timeout-ms:    "${READ_TIMEOUT_MS:5000}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
