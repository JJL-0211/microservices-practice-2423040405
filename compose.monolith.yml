# Week 05：monolith 单体 + MySQL 的容器编排（原样保留）
# 使用方法：docker compose -f compose.monolith.yml up -d --build
name: kitty-shop

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: kitty_shop
      MYSQL_USER: kittyp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - kitty-shop-mysql-data:/var/lib/mysql
    networks: [kitty-shop-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -uroot
          -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    image: kitty-shop:week05
    build:
      context: ./monolith
    ports: ["${APP_PORT:-8080}:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kitty_shop?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: kittyp
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [kitty-shop-network]

volumes:
  kitty-shop-mysql-data:

networks:
  kitty-shop-network:
